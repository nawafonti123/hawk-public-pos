name: Publish signed HAWK POS installers
on:
  push:
    paths: [release-payload.json]
permissions:
  contents: write
concurrency:
  group: signed-hawk-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node .github/scripts/publish-signed.mjs
        env:
          GH_TOKEN: ${{ github.token }}
